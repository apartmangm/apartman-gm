name: SEO optimization

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - '.github/workflows/seo-optimize.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    if: github.event.head_commit.message != 'SEO: optimize homepage metadata and content'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Optimize homepage
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')

          s = s.replace('<meta name="description" content="Apartman GM, Pale — udoban i praktičan smještaj između Jahorine i Sarajeva. Četiri sobe, privatna kupatila, privatni parking i direktan upit.">', '<meta name="description" content="Apartman GM u Palama — privatni smještaj blizu Jahorine i Sarajeva. 4 sobe, 4 privatna kupatila, parking, Wi‑Fi i smještaj do 13 gostiju.">\n<meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1">')
          s = s.replace('<title>Apartman GM | Pale · Jahorina</title>', '<title>Apartman GM Pale | Smještaj blizu Jahorine i Sarajeva</title>')
          s = s.replace('<link rel="canonical" href="https://apartmangm.com/">', '<link rel="canonical" href="https://apartmangm.com/">\n<meta property="og:type" content="website">\n<meta property="og:locale" content="sr_Latn_BA">\n<meta property="og:site_name" content="Apartman GM">\n<meta property="og:title" content="Apartman GM Pale | Smještaj blizu Jahorine i Sarajeva">\n<meta property="og:description" content="Privatni smještaj u Palama blizu Jahorine i Sarajeva — 4 sobe, 4 privatna kupatila, parking i Wi‑Fi.">\n<meta property="og:url" content="https://apartmangm.com/">\n<meta property="og:image" content="https://apartmangm.com/hero-apartman-gm1.jpg">\n<meta name="twitter:card" content="summary_large_image">\n<meta name="twitter:title" content="Apartman GM Pale | Smještaj blizu Jahorine i Sarajeva">\n<meta name="twitter:description" content="Privatni smještaj u Palama blizu Jahorine i Sarajeva — 4 sobe, 4 privatna kupatila, parking i Wi‑Fi.">\n<meta name="twitter:image" content="https://apartmangm.com/hero-apartman-gm1.jpg">')

          schema = '''\n<script type="application/ld+json">\n{\n  "@context": "https://schema.org",\n  "@graph": [\n    {\n      "@type": "WebSite",\n      "@id": "https://apartmangm.com/#website",\n      "url": "https://apartmangm.com/",\n      "name": "Apartman GM",\n      "inLanguage": "sr-Latn"\n    },\n    {\n      "@type": "LodgingBusiness",\n      "@id": "https://apartmangm.com/#lodging",\n      "name": "Apartman GM",\n      "url": "https://apartmangm.com/",\n      "description": "Privatni smještaj u Palama blizu Jahorine i Sarajeva sa četiri sobe, četiri privatna kupatila, zajedničkom kuhinjom, privatnim parkingom i Wi‑Fi mrežom.",\n      "image": ["https://apartmangm.com/hero-apartman-gm1.jpg"],\n      "telephone": "+38765654123",\n      "email": "apartman.gm@gmail.com",\n      "address": {\n        "@type": "PostalAddress",\n        "streetAddress": "Pribanjska 66",\n        "addressLocality": "Pale",\n        "postalCode": "71420",\n        "addressCountry": "BA"\n      },\n      "numberOfRooms": 4,\n      "amenityFeature": [\n        {"@type":"LocationFeatureSpecification","name":"parkingType","value":"Free"},\n        {"@type":"LocationFeatureSpecification","name":"internetType","value":"Free"}\n      ],\n      "availableLanguage": ["sr-Latn", "en"]\n    }\n  ]\n}\n</script>\n'''
          if 'https://apartmangm.com/#lodging' not in s:
              s = s.replace('</head>', schema + '</head>', 1)

          s = s.replace('data-sr="Odmor između Jahorine i Sarajeva." data-en="A stay between Jahorina and Sarajevo.">Odmor između Jahorine i Sarajeva.</h1>', 'data-sr="Apartman GM – smještaj u Palama blizu Jahorine i Sarajeva" data-en="Apartman GM – accommodation in Pale near Jahorina and Sarajevo">Apartman GM – smještaj u Palama blizu Jahorine i Sarajeva</h1>')
          s = s.replace('data-sr="Prostran i praktičan smještaj za porodice, prijatelje i grupe — uz privatna kupatila, parking i mirno okruženje." data-en="Spacious, practical accommodation for families, friends and groups — with private bathrooms, parking and a peaceful setting.">Prostran i praktičan smještaj za porodice, prijatelje i grupe — uz privatna kupatila, parking i mirno okruženje.</p>', 'data-sr="Apartman GM u Palama pruža miran i praktičan smještaj za porodice, prijatelje i grupe, sa četiri sobe, četiri privatna kupatila, zajedničkom kuhinjom, privatnim parkingom i Wi‑Fi mrežom." data-en="Apartman GM in Pale offers peaceful and practical accommodation for families, friends and groups, with four rooms, four private bathrooms, a shared kitchen, private parking and Wi‑Fi.">Apartman GM u Palama pruža miran i praktičan smještaj za porodice, prijatelje i grupe, sa četiri sobe, četiri privatna kupatila, zajedničkom kuhinjom, privatnim parkingom i Wi‑Fi mrežom.</p>')

          s = s.replace('<h2 data-sr="Jednostavno mjesto za miran boravak." data-en="A simple place for a comfortable stay.">Jednostavno mjesto za miran boravak.</h2>', '<h2 data-sr="Privatan smještaj u Palama za odmor blizu Jahorine." data-en="Private accommodation in Pale for a stay near Jahorina.">Privatan smještaj u Palama za odmor blizu Jahorine.</h2>')
          s = s.replace('<p data-sr="Pale su praktična baza za Jahorinu, Sarajevo, Ravnu planinu i okolne izlete." data-en="Pale are a practical base for Jahorina, Sarajevo, Ravna Planina and nearby excursions.">Pale su praktična baza za Jahorinu, Sarajevo, Ravnu planinu i okolne izlete.</p>', '<p data-sr="Pale su praktična baza za Jahorinu, Sarajevo, Ravnu planinu i okolne izlete. Apartman GM je namijenjen gostima koji žele kombinovati planinu, skijanje, prirodu i obilazak Sarajeva." data-en="Pale are a practical base for Jahorina, Sarajevo, Ravna Planina and nearby excursions. Apartman GM is suitable for guests who want to combine mountains, skiing, nature and visits to Sarajevo.">Pale su praktična baza za Jahorinu, Sarajevo, Ravnu planinu i okolne izlete. Apartman GM je namijenjen gostima koji žele kombinovati planinu, skijanje, prirodu i obilazak Sarajeva.</p>')

          s = s.replace('<details><summary data-sr="Da li je parking obezbijeđen?" data-en="Is parking available?">Da li je parking obezbijeđen?</summary><p data-sr="Da, gostima je na raspolaganju privatni parking." data-en="Yes, private parking is available for guests.">Da, gostima je na raspolaganju privatni parking.</p></details>', '<details><summary data-sr="Koliko gostiju može boraviti u Apartmanu GM?" data-en="How many guests can stay at Apartman GM?">Koliko gostiju može boraviti u Apartmanu GM?</summary><p data-sr="U četiri sobe moguće je organizovati smještaj do 13 gostiju, zavisno od kombinacije soba i rasporeda ležajeva." data-en="The four rooms can accommodate up to 13 guests, depending on the selected rooms and sleeping arrangement.">U četiri sobe moguće je organizovati smještaj do 13 gostiju, zavisno od kombinacije soba i rasporeda ležajeva.</p></details><details><summary data-sr="Da li je parking obezbijeđen?" data-en="Is parking available?">Da li je parking obezbijeđen?</summary><p data-sr="Da, gostima je na raspolaganju privatni parking." data-en="Yes, private parking is available for guests.">Da, gostima je na raspolaganju privatni parking.</p></details>')

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit SEO changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "SEO: optimize homepage metadata and content"
          git push
