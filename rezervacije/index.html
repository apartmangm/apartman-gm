<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3d91"><link rel="manifest" href="manifest.webmanifest"><title>Apartman GM — Rezervacije</title><style>:root{--b:#0b3d91;--bg:#f3f5f8;--l:#dce1e8;--m:#687386;--ok:#176b42;--bad:#a12626}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial;color:#18212b}.app{max-width:900px;margin:auto;padding:14px}.top,.card{background:#fff;border:1px solid var(--l);border-radius:17px;padding:16px;margin-bottom:14px}.top{display:flex;gap:13px;align-items:center}.logo{width:66px;height:66px;border-radius:12px}.brand h1{margin:0}.brand p{margin:3px 0;color:var(--m)}.tabs{display:flex;gap:8px;overflow:auto;margin-bottom:14px}.tab,.btn{border:0;border-radius:10px;padding:11px 14px;font-weight:700;background:#fff;border:1px solid var(--l);cursor:pointer}.tab.active,.primary{background:var(--b);color:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}label{display:block;color:var(--m);font-size:12px;font-weight:700;margin-bottom:5px}input,select,textarea{width:100%;min-height:45px;border:1px solid var(--l);border-radius:10px;padding:9px 11px;font-size:16px;background:#fff}textarea{min-height:110px}.actions{display:flex;flex-wrap:wrap;gap:9px}.hidden{display:none!important}.notice{color:var(--m);font-size:12px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.metric{border:1px solid var(--l);border-radius:12px;padding:12px}.metric small{display:block;color:var(--m)}.metric strong{font-size:18px}.booking{border-top:1px solid var(--l);padding:12px 0;display:flex;justify-content:space-between;gap:10px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#fff2d6}.ok{background:#e7f5ee;color:var(--ok)}.bad{background:#ffe8e8;color:var(--bad)}.print{background:#fff;padding:28px}.print table{width:100%;border-collapse:collapse}.print td{border:1px solid var(--l);padding:8px}.print td:first-child{background:#f5f6f8;font-weight:700;width:36%}.availability{margin-top:7px;padding:10px 12px;border-radius:10px;font-size:13px;font-weight:700}.availability.ok{background:#e7f5ee;color:var(--ok)}.availability.bad{background:#ffe8e8;color:var(--bad)}@media(max-width:600px){.grid,.metrics{grid-template-columns:1fr 1fr}}@media(max-width:420px){.grid,.metrics{grid-template-columns:1fr}}@media print{.noPrint{display:none!important}.print{display:block!important}body{background:#fff}@page{size:A4;margin:14mm}}</style></head><body><div class="app"><div class="top"><img class="logo" src="logo.svg"><div class="brand"><h1>Apartman GM</h1><p>Rezervacije • potvrde • evidencija</p></div></div><div class="tabs noPrint"><button class="tab active" data-t="new">Nova</button><button class="tab" data-t="list">Rezervacije</button><button class="tab" data-t="dash">Pregled</button><button class="tab" data-t="set">Postavke</button></div><section id="new" class="noPrint"><div class="card"><h2>Nova rezervacija</h2><div class="grid"><div><label>Broj rezervacije</label><input id="no" readonly></div><div><label>Status</label><select id="status"><option>Čeka avans</option><option>Potvrđena</option><option>Završena</option><option>Otkazana</option></select></div><div class="full"><label>Gost</label><input id="guest" placeholder="Ime i prezime"></div><div><label>Odrasli</label><input id="ad" type="number" min="0" value="2"></div><div><label>Djeca</label><input id="ch" type="number" min="0" value="0"></div><div><label>Djeca do 2 godine</label><input id="bb" type="number" min="0" value="0"></div><div><label>Dolazak</label><input id="ci" type="date"></div><div><label>Odlazak</label><input id="co" type="date"></div><div><label>Telefon</label><input id="phone" type="tel"></div><div><label>E-mail</label><input id="email" type="email"></div><div class="full"><label>Opcija smještaja</label><select id="acc"></select><div id="desc" class="notice"></div><div id="availability" class="availability ok">Izaberite datume i opciju smještaja.</div></div></div></div><div class="card"><h2>Plaćanje</h2><div class="grid"><div><label>Ukupna cijena (€)</label><input id="total" type="number" min="0" step="1" value="0"></div><div><label>Avans (%)</label><input id="pct" type="number" min="0" max="100" value="30"></div><div><label>Avans (€)</label><input id="dep" readonly></div><div><label>Preostalo (€)</label><input id="bal" readonly></div><div><label>Datum uplate</label><input id="pd" type="date"></div><div><label>Način plaćanja</label><select id="pm"><option>Bankovni transfer</option><option>Gotovina</option><option>PayPal</option><option>Drugo</option></select></div></div></div><div class="card"><label>Uslovi otkazivanja</label><textarea id="cancel">Otkazivanje više od 30 dana prije dolaska: avans se vraća u cijelosti. Otkazivanje 15–30 dana prije dolaska: zadržava se 50% avansa. Otkazivanje manje od 15 dana prije dolaska ili nedolazak: avans se ne vraća.</textarea><label>Napomena</label><textarea id="note" placeholder="Posebni zahtjevi gosta..."></textarea></div><div class="actions"><button class="btn primary" id="save">Sačuvaj</button><button class="btn" id="pdf">Prikaži i sačuvaj PDF</button><button class="btn" id="reset">Novi obrazac</button></div></section><section id="list" class="hidden noPrint"><div class="card"><h2>Rezervacije</h2><input id="search" placeholder="Pretraži gosta, broj ili datum"><div class="actions"><button class="btn filter" data-f="all">Sve</button><button class="btn filter" data-f="Čeka avans">Čeka avans</button><button class="btn filter" data-f="Potvrđena">Potvrđene</button><button class="btn filter" data-f="Završena">Završene</button></div><div id="items"></div></div></section><section id="dash" class="hidden noPrint"><div class="card"><h2>Pregled poslovanja</h2><div class="metrics"><div class="metric"><small>Rezervacije</small><strong id="mc">0</strong></div><div class="metric"><small>Potvrđene</small><strong id="mok">0</strong></div><div class="metric"><small>Vrijednost</small><strong id="mr">0 €</strong></div><div class="metric"><small>Avansi</small><strong id="md">0 €</strong></div></div></div><div class="card"><h2>Naredni dolasci</h2><div id="up"></div></div></section><section id="set" class="hidden noPrint"><div class="card"><h2>Postavke</h2><label>Podrazumijevani avans (%)</label><input id="spct" type="number" min="0" max="100" value="30"><label>Opcije smještaja — jedna opcija u svakom redu</label><textarea id="opts"></textarea><button class="btn primary" id="sset">Sačuvaj postavke</button></div></section><section id="print" class="hidden print"><div id="doc"></div></section></div><script>const $=x=>document.getElementById(x),KEY='gmR4',SET='gmS4';const DEF=['Soba broj 1.','Soba broj 2.','Soba broj 3.','Soba broj 4.','Apartman GM 120 m² – kompletan apartman.','Apartman GM 90 m²','(Apartman 120 m² bez sobe broj 1. Soba br. 1 ostaje slobodna za izdavanje.)','Soba 1 + Soba 2 = 4 ili 5 osoba.','Soba 2 + Soba 3 = 3 do 6 osoba.','Soba 3 + Soba 4 = 4 do 9 osoba.'];let filter='all',editingNo=null;const money=n=>Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2});const fd=s=>s?new Date(s+'T00:00:00').toLocaleDateString('sr-RS'):'';const ns=(a,b)=>a&&b?Math.max(0,Math.round((new Date(b)-new Date(a))/86400000)):0;function data(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch{return[]}}function save(a){localStorage.setItem(KEY,JSON.stringify(a))}function settings(){try{let s=JSON.parse(localStorage.getItem(SET)||'null');return s||{pct:30,opts:DEF}}catch{return{pct:30,opts:DEF}}}function options(){return settings().opts||DEF}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function roomSet(x){let s=String(x||'').toLowerCase();if(s.includes('120 m²')||s.includes('120 m2'))return[1,2,3,4];if(s.includes('90 m²')||s.includes('90 m2'))return[2,3,4];let m=s.match(/soba\s*1\s*\+\s*soba\s*2/);if(m)return[1,2];m=s.match(/soba\s*2\s*\+\s*soba\s*3/);if(m)return[2,3];m=s.match(/soba\s*3\s*\+\s*soba\s*4/);if(m)return[3,4];m=s.match(/soba\s*broj\s*([1-4])/);if(m)return[+m[1]];m=s.match(/^soba\s*([1-4])/);if(m)return[+m[1]];return[]}function overlaps(a,b){return a&&b&&a<b}function conflictFor(x,ignoreNo){if(!x.ci||!x.co)return[];let wanted=roomSet(x.acc);if(!wanted.length)return[];return data().filter(r=>r.no!==ignoreNo&&r.status!=='Otkazana'&&overlaps(x.ci,r.co)&&overlaps(r.ci,x.co)&&roomSet(r.acc).some(n=>wanted.includes(n)))}function updateAvailability(){let x={no:editingNo||$('no').value,ci:$('ci').value,co:$('co').value,acc:$('acc').value};let el=$('availability');if(!x.ci||!x.co){el.className='availability ok';el.textContent='Izaberite datume i opciju smještaja.';return true}if(ns(x.ci,x.co)<1){el.className='availability bad';el.textContent='Odlazak mora biti nakon dolaska.';return false}let c=conflictFor(x,editingNo||$('no').value);if(c.length){el.className='availability bad';el.innerHTML='NEDOSTUPNO — preklapa se sa: '+c.map(r=>esc(r.no)+' ('+esc(r.acc)+', '+fd(r.ci)+' → '+fd(r.co)+')').join('; ');return false}el.className='availability ok';el.textContent='DOSTUPNO — nema preklapanja sa postojećim rezervacijama.';return true}function fill(sel){let old=sel?.value;$('acc').innerHTML=options().map(x=>'<option value="'+esc(x)+'">'+esc(x)+'</option>').join('');if(old&&options().includes(old))$('acc').value=old;desc();updateAvailability()}function desc(){let x=$('acc').value,d=x==='Apartman GM 90 m²'?'Isti prostor kao Apartman GM 120 m², bez sobe br. 1. Soba br. 1 nije uključena u rezervaciju i može biti zasebno izdana drugom gostu.':x.startsWith('Soba 1 +')?'Kombinacija soba 1 i 2 — kapacitet 4 ili 5 osoba.':x.startsWith('Soba 2 +')?'Kombinacija soba 2 i 3 — kapacitet 3 do 6 osoba.':x.startsWith('Soba 3 +')?'Kombinacija soba 3 i 4 — kapacitet 4 do 9 osoba.':'';$('desc').textContent=d;updateAvailability()}function calc(){let t=+$('total').value||0,p=Math.max(0,Math.min(100,+$('pct').value||0)),d=Math.round(t*p)/100;$('dep').value=d.toFixed(2);$('bal').value=(t-d).toFixed(2)}function nextNo(){let y=new Date().getFullYear(),k='gmNo'+y,a=data(),max=+(localStorage.getItem(k)||0);a.forEach(r=>{let m=String(r.no||'').match(new RegExp('^GM-'+y+'-(\\d+)$'));if(m)max=Math.max(max,+m[1])});let n=max+1;localStorage.setItem(k,n);return'GM-'+y+'-'+String(n).padStart(3,'0')}function reset(){editingNo=null;let s=settings();$('no').value=nextNo();$('status').value='Čeka avans';$('guest').value='';$('ad').value=2;$('ch').value=0;$('bb').value=0;$('ci').value='';$('co').value='';$('phone').value='';$('email').value='';$('total').value=0;$('pct').value=s.pct;$('dep').value='0.00';$('bal').value='0.00';$('pd').value='';$('pm').value='Bankovni transfer';fill();$('note').value='';$('cancel').value='Otkazivanje više od 30 dana prije dolaska: avans se vraća u cijelosti. Otkazivanje 15–30 dana prije dolaska: zadržava se 50% avansa. Otkazivanje manje od 15 dana prije dolaska ili nedolazak: avans se ne vraća.';calc()}function form(){calc();return{no:$('no').value,status:$('status').value,guest:$('guest').value,ad:+$('ad').value||0,ch:+$('ch').value||0,bb:+$('bb').value||0,ci:$('ci').value,co:$('co').value,phone:$('phone').value,email:$('email').value,acc:$('acc').value,total:+$('total').value||0,dep:+$('dep').value||0,bal:+$('bal').value||0,pd:$('pd').value,pm:$('pm').value,cancel:$('cancel').value,note:$('note').value,n:ns($('ci').value,$('co').value)}}function badge(s){return'<span class="badge '+(s==='Potvrđena'?'ok':s==='Otkazana'?'bad':'')+'">'+esc(s)+'</span>'}function render(){let q=$('search').value.toLowerCase(),a=data().filter(x=>(filter==='all'||x.status===filter)&&JSON.stringify(x).toLowerCase().includes(q)).sort((x,y)=>x.ci.localeCompare(y.ci));$('items').innerHTML=a.length?a.map(x=>'<div class="booking"><div><b>'+esc(x.no)+' — '+esc(x.guest)+' '+badge(x.status)+'</b><div class="notice">'+fd(x.ci)+' → '+fd(x.co)+' • '+x.n+' noći • '+(x.ad+x.ch+x.bb)+' gostiju • '+money(x.total)+' €<br>'+esc(x.acc)+'</div></div><div class="actions"><button class="btn" onclick="openR(\''+esc(x.no)+'\')">Otvori</button><button class="btn" onclick="delR(\''+esc(x.no)+'\')">Obriši</button></div></div>').join(''):'<p class="notice">Nema rezervacija.</p>'}window.openR=n=>{let x=data().find(r=>r.no===n);if(!x)return;editingNo=x.no;Object.entries({no:x.no,status:x.status,guest:x.guest,ad:x.ad,ch:x.ch,bb:x.bb,ci:x.ci,co:x.co,phone:x.phone,email:x.email,total:x.total,pct:x.total?x.dep/x.total*100:0,pd:x.pd,pm:x.pm,note:x.note,cancel:x.cancel}).forEach(([k,v])=>$(k).value=v??'');fill();$('acc').value=x.acc;desc();calc();tab('new')};window.delR=n=>{if(confirm('Obrisati rezervaciju?')){save(data().filter(x=>x.no!==n));render();dash()}};function dash(){let a=data(),act=a.filter(x=>x.status!=='Otkazana');$('mc').textContent=a.length;$('mok').textContent=a.filter(x=>x.status==='Potvrđena').length;$('mr').textContent=money(act.reduce((s,x)=>s+x.total,0))+' €';$('md').textContent=money(act.reduce((s,x)=>s+x.dep,0))+' €';let today=new Date().toISOString().slice(0,10),u=act.filter(x=>x.co>=today).sort((x,y)=>x.ci.localeCompare(y.ci)).slice(0,8);$('up').innerHTML=u.length?u.map(x=>'<div class="booking"><b>'+esc(x.guest)+'</b><div class="notice">'+fd(x.ci)+' → '+fd(x.co)+' • '+esc(x.acc)+'</div></div>').join(''):'<p class="notice">Nema narednih dolazaka.</p>'}function tab(t){['new','list','dash','set','print'].forEach(x=>$(x).classList.toggle('hidden',x!==t));document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.t===t));if(t==='list')render();if(t==='dash')dash()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.t));['total','pct'].forEach(x=>$(x).oninput=calc);['ci','co'].forEach(x=>$(x).onchange=updateAvailability);$('acc').onchange=desc;$('save').onclick=()=>{let x=form();if(!x.guest.trim()||!x.ci||!x.co||x.n<1)return alert('Unesi ime gosta i ispravne datume.');if(!updateAvailability())return alert('Rezervacija nije sačuvana jer izabrani prostor nije dostupan u tom periodu.');let a=data(),i=a.findIndex(r=>r.no===x.no);if(i>=0)a[i]=x;else a.push(x);save(a);alert('Rezervacija je sačuvana.');render();dash()};$('reset').onclick=reset;$('search').oninput=render;document.querySelectorAll('.filter').forEach(b=>b.onclick=()=>{filter=b.dataset.f;render()});$('sset').onclick=()=>{let o=$('opts').value.split('\n').map(x=>x.trim()).filter(Boolean);if(!o.length)return alert('Unesi najmanje jednu opciju.');localStorage.setItem(SET,JSON.stringify({pct:+$('spct').value||0,opts:o}));fill();alert('Postavke su sačuvane.')};$('pdf').onclick=()=>{let x=form();$('doc').innerHTML='<h1>Apartman GM</h1><h2>Potvrda rezervacije</h2><table><tr><td>Broj rezervacije</td><td>'+esc(x.no)+'</td></tr><tr><td>Gost</td><td>'+esc(x.guest)+'</td></tr><tr><td>Smještaj</td><td>'+esc(x.acc)+'</td></tr><tr><td>Dolazak</td><td>'+fd(x.ci)+'</td></tr><tr><td>Odlazak</td><td>'+fd(x.co)+'</td></tr><tr><td>Gosti</td><td>'+x.ad+' odraslih, '+x.ch+' djece, '+x.bb+' djece do 2 godine</td></tr><tr><td>Ukupna cijena</td><td>'+money(x.total)+' €</td></tr><tr><td>Avans</td><td>'+money(x.dep)+' €</td></tr><tr><td>Preostalo</td><td>'+money(x.bal)+' €</td></tr><tr><td>Način plaćanja</td><td>'+esc(x.pm)+'</td></tr><tr><td>Uslovi otkazivanja</td><td>'+esc(x.cancel).replace(/\n/g,'<br>')+'</td></tr><tr><td>Napomena</td><td>'+esc(x.note)+'</td></tr></table>';tab('print');setTimeout(()=>window.print(),150)};reset();$('spct').value=settings().pct;$('opts').value=options().join('\n');</script></body></html>
