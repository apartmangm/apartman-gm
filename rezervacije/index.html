<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b3d91"><link rel="manifest" href="manifest.webmanifest"><title>Apartman GM — Rezervacije</title><style>:root{--b:#0b3d91;--bg:#f4f6f9;--card:#fff;--line:#dce1e8;--muted:#667085;--ok:#187447;--bad:#a22}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,sans-serif;color:#18212b}.app{max-width:850px;margin:auto;padding:14px}.top,.card{background:var(--card);border:1px solid var(--line);border-radius:17px;padding:16px;margin-bottom:14px}.top{display:flex;gap:13px;align-items:center}.logo{width:65px;height:65px;border-radius:12px}.top h1{font-size:20px;margin:0}.muted,.hint{color:var(--muted);font-size:12px}.tabs{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.tab,button{min-height:44px;border:1px solid var(--line);border-radius:10px;padding:9px 13px;font-weight:700;background:#fff;cursor:pointer}.tab.active,.primary{background:var(--b);color:#fff;border-color:var(--b)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.full{grid-column:1/-1}label{display:block;font-size:12px;font-weight:700;color:var(--muted);margin-bottom:5px}input,select,textarea{width:100%;min-height:45px;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:16px;background:#fff}textarea{min-height:95px}.actions{display:flex;flex-wrap:wrap;gap:8px}.metric{border:1px solid var(--line);border-radius:12px;padding:11px}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric small{display:block;color:var(--muted);font-size:11px}.metric b{font-size:18px}.booking{border-top:1px solid var(--line);padding:11px 0;display:flex;justify-content:space-between;gap:10px}.booking:first-child{border-top:0}.badge{display:inline-block;padding:4px 7px;border-radius:99px;font-size:10px;font-weight:700}.ok{background:#e6f4ec;color:var(--ok)}.wait{background:#fff3d5;color:#8b6000}.bad{background:#ffe9e9;color:var(--bad)}.hidden{display:none!important}.confirm{background:#fff;padding:28px;line-height:1.45}.confirmhead{display:flex;justify-content:space-between;border-bottom:2px solid var(--b);padding-bottom:14px;margin-bottom:17px}.confirmhead img{width:80px}.confirm h1{font-size:22px;margin:5px 0}.ct{width:100%;border-collapse:collapse;margin:12px 0}.ct td{border:1px solid #dce1e8;padding:8px}.ct td:first-child{background:#f5f6f8;font-weight:700;width:36%}.money{font-size:20px;font-weight:700}.printonly{display:none}@media(max-width:600px){.grid,.metrics{grid-template-columns:1fr 1fr}.full{grid-column:1/-1}}@media(max-width:420px){.grid,.metrics{grid-template-columns:1fr}.full{grid-column:auto}}@media print{body{background:#fff}.app>*:not(.printonly){display:none!important}.printonly{display:block!important}.confirm{padding:0}@page{size:A4;margin:14mm}}</style></head><body><div class="app"><div class="top"><img class="logo" src="logo.svg"><div><h1>Apartman GM</h1><div class="muted">Rezervacije • potvrde • evidencija</div></div></div><div class="tabs"><button class="tab active" data-t="new">Nova</button><button class="tab" data-t="list">Rezervacije</button><button class="tab" data-t="dash">Pregled</button><button class="tab" data-t="set">Postavke</button></div><section id="new" class="card"><h2>Nova rezervacija</h2><div class="grid"><div><label>Broj rezervacije</label><input id="no" readonly></div><div><label>Status</label><select id="status"><option>Čeka avans</option><option>Potvrđena</option><option>Završena</option><option>Otkazana</option></select></div><div class="full"><label>Gost / Guest</label><input id="guest" placeholder="Ime i prezime"></div><div><label>Odrasli</label><input id="adults" type="number" min="0" value="2"></div><div><label>Djeca</label><input id="children" type="number" min="0" value="0"></div><div><label>Djeca do 2 godine</label><input id="babies" type="number" min="0" value="0"></div><div><label>Dolazak</label><input id="in" type="date"></div><div><label>Odlazak</label><input id="out" type="date"></div><div><label>Telefon</label><input id="phone" type="tel"></div><div><label>E-mail</label><input id="email" type="email"></div><div class="full"><label>Smještaj</label><input id="acc" value="Apartman GM — kompletan apartman, privatno korištenje"></div></div></section><section class="card" id="pay"><h2>Plaćanje</h2><div class="grid"><div><label>Ukupna cijena (€)</label><input id="total" type="number" min="0" value="0"></div><div><label>Avans (%)</label><input id="pct" type="number" min="0" max="100" value="30"></div><div><label>Avans (€)</label><input id="dep" readonly></div><div><label>Preostalo (€)</label><input id="bal" readonly></div><div><label>Datum uplate</label><input id="pdate" type="date"></div><div><label>Način plaćanja</label><select id="method"><option>Bankovni transfer</option><option>PayPal</option><option>Gotovina</option><option>Drugo</option></select></div></div></section><section class="card" id="terms"><h2>Uslovi</h2><label>Otkazivanje</label><textarea id="cancel">Otkazivanje više od 30 dana prije dolaska: avans se vraća u cijelosti. Otkazivanje 15–30 dana prije dolaska: zadržava se 50% avansa. Otkazivanje manje od 15 dana prije dolaska ili nedolazak: avans se ne vraća. Sve izmjene i izuzeci važe samo ako su prethodno pisano potvrđeni od strane domaćina.</textarea><label>Napomena</label><textarea id="note" placeholder="Posebni zahtjevi gosta..."></textarea></section><div class="actions" id="formActions"><button class="primary" id="save">Sačuvaj</button><button id="preview">Prikaži i sačuvaj PDF</button><button id="reset">Novi obrazac</button></div><section id="list" class="card hidden"><h2>Rezervacije</h2><input id="search" placeholder="Pretraži gosta, broj ili datum"><div id="listbox"></div></section><section id="dash" class="hidden"><div class="card"><h2>Pregled</h2><div class="metrics"><div class="metric"><small>Rezervacija</small><b id="mc">0</b></div><div class="metric"><small>Potvrđenih</small><b id="mp">0</b></div><div class="metric"><small>Vrijednost</small><b id="mr">0 €</b></div><div class="metric"><small>Avansi</small><b id="md">0 €</b></div></div></div><div class="card"><h2>Naredni dolasci</h2><div id="up"></div></div></section><section id="set" class="card hidden"><h2>Postavke</h2><div class="grid"><div><label>Podrazumijevani avans (%)</label><input id="spct" type="number" value="30"></div><div class="full"><label>Podrazumijevani smještaj</label><input id="sacc" value="Apartman GM — kompletan apartman, privatno korištenje"></div></div><button class="primary" id="saves">Sačuvaj postavke</button></section><section class="printonly"><div id="confirm" class="confirm"></div></section></div><script>
(()=>{const $=x=>document.getElementById(x),K='gmBookingsV4',S='gmSettingsV4',money=n=>Number(n||0).toLocaleString('de-DE',{minimumFractionDigits:2,maximumFractionDigits:2}),fmt=s=>s?`${s.slice(8,10)}.${s.slice(5,7)}.${s.slice(0,4)}.`:'—',nights=(a,b)=>a&&b?Math.max(0,Math.round((new Date(b+'T00:00:00Z')-new Date(a+'T00:00:00Z'))/86400000)):0,esc=s=>String(s??'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&quot;','"':'&quot;'}[c]));let filter='all';const get=()=>JSON.parse(localStorage.getItem(K)||'[]'),put=a=>localStorage.setItem(K,JSON.stringify(a));function num(){let y=new Date().getFullYear(),k='gmNo'+y,n=+localStorage.getItem(k)||0;n++;localStorage.setItem(k,n);return`GM-${y}-${String(n).padStart(3,'0')}`}function calc(){let t=Math.max(0,+$('total').value||0),p=Math.min(100,Math.max(0,+$('pct').value||0)),d=Math.round(t*p)/100;$('dep').value=d.toFixed(2);$('bal').value=(t-d).toFixed(2)}function data(){calc();return{no:$('no').value,status:$('status').value,guest:$('guest').value,adults:+$('adults').value||0,children:+$('children').value||0,babies:+$('babies').value||0,in:$('in').value,out:$('out').value,phone:$('phone').value,email:$('email').value,acc:$('acc').value,total:+$('total').value||0,dep:+$('dep').value||0,bal:+$('bal').value||0,pdate:$('pdate').value,method:$('method').value,cancel:$('cancel').value,note:$('note').value,n:nights($('in').value,$('out').value)}}function reset(){let s=JSON.parse(localStorage.getItem(S)||'{"pct":30,"acc":"Apartman GM — kompletan apartman, privatno korištenje"}');$('no').value=num();$('status').value='Čeka avans';$('guest').value='';$('adults').value=2;$('children').value=0;$('babies').value=0;$('in').value='';$('out').value='';$('phone').value='';$('email').value='';$('total').value=0;$('pct').value=s.pct;$('pdate').value='';$('method').value='Bankovni transfer';$('acc').value=s.acc;$('note').value='';calc()}function show(d){if(!d.guest.trim()||!d.in||!d.out||d.n<1){alert('Unesi gosta i ispravne datume.');return}document.querySelector('.top').classList.add('hidden');document.querySelector('.tabs').classList.add('hidden');['new','pay','terms','formActions','list','dash','set'].forEach(x=>$(x).classList.add('hidden'));document.querySelector('.printonly').classList.remove('hidden');$('confirm').innerHTML=`<div class="confirmhead"><div><img src="logo.svg"><h1>APARTMAN GM</h1><div class="muted">POTVRDA REZERVACIJE / BOOKING CONFIRMATION</div></div><b>REZERVACIJA POTVRĐENA</b></div><table class="ct"><tr><td>Broj rezervacije</td><td>${esc(d.no)}</td></tr><tr><td>Gost</td><td>${esc(d.guest)}</td></tr><tr><td>Gosti</td><td>${d.adults+d.children+d.babies} (${d.adults} odraslih, ${d.children} djece, ${d.babies} do 2 godine)</td></tr><tr><td>Dolazak</td><td>${fmt(d.in)}</td></tr><tr><td>Odlazak</td><td>${fmt(d.out)}</td></tr><tr><td>Noćenja</td><td>${d.n}</td></tr><tr><td>Smještaj</td><td>${esc(d.acc)}</td></tr></table><h3>FINANSIJSKI PODACI / PAYMENT DETAILS</h3><table class="ct"><tr><td>Ukupno</td><td class="money">${money(d.total)} €</td></tr><tr><td>Avans</td><td class="money">${money(d.dep)} €</td></tr><tr><td>Preostalo</td><td class="money">${money(d.bal)} €</td></tr><tr><td>Datum uplate</td><td>${fmt(d.pdate)}</td></tr><tr><td>Način plaćanja</td><td>${esc(d.method)}</td></tr></table><h3>USLOVI</h3><p>Rezervacija je potvrđena nakon evidentirane uplate avansa. Preostali iznos plaća se najkasnije prilikom dolaska, osim ako je drugačije pisano dogovoreno.</p><p><b>Otkazivanje:</b> ${esc(d.cancel)}</p>${d.note?`<p><b>Napomena:</b> ${esc(d.note)}</p>`:''}<p style="text-align:center;margin-top:28px"><b>Hvala što ste odabrali Apartman GM.</b><br>Thank you for choosing Apartment GM.</p>`;setTimeout(()=>window.print(),150)}function list(){let q=$('search').value.toLowerCase(),a=get().filter(d=>(filter==='all'||d.status===filter)&&JSON.stringify(d).toLowerCase().includes(q)).sort((x,y)=>x.in.localeCompare(y.in));$('listbox').innerHTML=a.length?a.map(d=>`<div class="booking"><div><b>${esc(d.no)} — ${esc(d.guest)}</b><span class="badge ${d.status==='Potvrđena'?'ok':d.status==='Otkazana'?'bad':'wait'}">${esc(d.status)}</span><div class="muted">${fmt(d.in)} → ${fmt(d.out)} • ${d.n} noći • ${d.adults+d.children+d.babies} gostiju • ${money(d.total)} €</div></div><div class="actions"><button data-open="${esc(d.no)}">Otvori</button><button class="danger" data-del="${esc(d.no)}">Obriši</button></div></div>`).join(''):'<p class="hint">Nema rezervacija.</p>';document.querySelectorAll('[data-open]').forEach(b=>b.onclick=()=>{let d=get().find(x=>x.no===b.dataset.open);if(d){Object.entries({no:d.no,status:d.status,guest:d.guest,adults:d.adults,children:d.children,babies:d.babies,in:d.in,out:d.out,phone:d.phone,email:d.email,acc:d.acc,total:d.total,pct:d.total?Math.round(d.dep/d.total*100):0,pdate:d.pdate,method:d.method,cancel:d.cancel,note:d.note}).forEach(([k,v])=>$(k).value=v??'');calc();tab('new')}});document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>{if(confirm('Obrisati rezervaciju?')){put(get().filter(x=>x.no!==b.dataset.del));list();dash()}})}function dash(){let a=get(),active=a.filter(x=>x.status!=='Otkazana'),p=a.filter(x=>x.status==='Potvrđena');$('mc').textContent=a.length;$('mp').textContent=p.length;$('mr').textContent=money(active.reduce((s,x)=>s+x.total,0))+' €';$('md').textContent=money(active.reduce((s,x)=>s+x.dep,0))+' €';let t=new Date().toISOString().slice(0,10),u=a.filter(x=>x.status!=='Otkazana'&&x.out>=t).sort((x,y)=>x.in.localeCompare(y.in)).slice(0,10);$('up').innerHTML=u.length?u.map(x=>`<div class="booking"><div><b>${esc(x.guest)}</b><div class="muted">${fmt(x.in)} → ${fmt(x.out)} • ${money(x.total)} €</div></div></div>`).join(''):'<p class="hint">Nema narednih dolazaka.</p>'}function tab(t){document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.t===t));['new','list','dash','set'].forEach(x=>$(x).classList.toggle('hidden',x!==t));['pay','terms','formActions'].forEach(x=>$(x).classList.toggle('hidden',t!=='new'));if(t==='list')list();if(t==='dash')dash()}document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>tab(b.dataset.t));$('total').oninput=calc;$('pct').oninput=calc;$('save').onclick=()=>{let d=data();if(!d.guest.trim()||d.n<1){alert('Unesi gosta i ispravne datume.');return}let a=get(),i=a.findIndex(x=>x.no===d.no);if(i>=0)a[i]=d;else a.push(d);put(a);list();dash();alert('Rezervacija je sačuvana.')} ;$('preview').onclick=()=>show(data());$('reset').onclick=reset;$('search').oninput=list;$('saves').onclick=()=>{localStorage.setItem(S,JSON.stringify({pct:+$('spct').value||30,acc:$('sacc').value}));alert('Postavke sačuvane.')};reset();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});})()
</script></body></html>
